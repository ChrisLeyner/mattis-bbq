<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Consultas - Matti's BBQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f4f4f4; padding-bottom: 20px; }
        .query-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .result-table { font-size: 0.85rem; overflow-x: auto; max-height: 500px; overflow-y: auto; }
        .result-table table { width: 100%; border-collapse: collapse; }
        .result-table th { background: #d32f2f; color: white; padding: 8px 12px; text-align: left; position: sticky; top: 0; z-index: 10; }
        .result-table td { padding: 6px 12px; border-bottom: 1px solid #eee; }
        .result-table tr:hover { background: #f5f5f5; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #d32f2f; }
        .stat-label { font-size: 0.8rem; color: #666; }
        .filter-group { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .password-box { background: white; border-radius: 16px; padding: 30px; max-width: 400px; width: 90%; }
    </style>
</head>
<body>
    <!-- Pantalla de contraseña -->
    <div id="passwordOverlay" class="password-overlay">
        <div class="password-box">
            <h4 class="text-center mb-3"><i class="fas fa-lock"></i> Acceso a Consultas</h4>
            <p class="text-muted text-center">Ingresa la contraseña para acceder</p>
            <input type="password" id="queryPassword" class="form-control form-control-lg mb-3" placeholder="Contraseña" onkeyup="if(event.key==='Enter') verificarPassword()">
            <button onclick="verificarPassword()" class="btn btn-danger w-100">ACCEDER</button>
            <p id="passwordError" class="text-danger text-center mt-2" style="display: none;">❌ Contraseña incorrecta</p>
        </div>
    </div>

    <!-- Contenido principal -->
    <div id="queryContent" style="display: none;">
        <nav class="navbar navbar-dark bg-dark sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><i class="fas fa-search"></i> CONSULTAS - MATTI'S B-B-Q</a>
                <div>
                    <button class="btn btn-outline-light btn-sm me-1" onclick="buscar()"><i class="fas fa-sync-alt"></i> Actualizar</button>
                    <button class="btn btn-outline-light btn-sm" onclick="location.href='/'"><i class="fas fa-arrow-left"></i> Volver a Caja</button>
                </div>
            </div>
        </nav>

        <div class="container mt-3">
            <!-- Filtros -->
            <div class="query-card">
                <h5><i class="fas fa-filter"></i> Filtros de Búsqueda</h5>
                <div class="filter-group">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">📅 Fecha desde</label>
                            <input type="date" id="fechaDesde" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">📅 Fecha hasta</label>
                            <input type="date" id="fechaHasta" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">📋 Número de Orden</label>
                            <input type="text" id="numeroOrden" class="form-control" placeholder="Ej: ORD-123456">
                        </div>
                    </div>
                    <div class="row g-3 mt-2">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">👤 Cliente / Mesa</label>
                            <input type="text" id="clienteBuscar" class="form-control" placeholder="Ej: Mesa 5">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">💳 Método de Pago</label>
                            <select id="metodoPagoFiltro" class="form-select">
                                <option value="">Todos</option>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Dólares">Dólares</option>
                                <option value="Tarjeta">Tarjeta</option>
                                <option value="Transferencia">Transferencia</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">📊 Estado</label>
                            <select id="estadoFiltro" class="form-select">
                                <option value="">Todos</option>
                                <option value="pagado">Pagado</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="preparado">Preparado</option>
                                <option value="entregado">Entregado</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12">
                            <button onclick="buscar()" class="btn btn-danger">
                                <i class="fas fa-search"></i> BUSCAR
                            </button>
                            <button onclick="limpiarFiltros()" class="btn btn-secondary ms-2">
                                <i class="fas fa-eraser"></i> Limpiar
                            </button>
                            <button onclick="exportarCSV()" class="btn btn-success ms-2">
                                <i class="fas fa-file-csv"></i> Exportar CSV
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Resumen -->
            <div class="query-card" id="resumenCard">
                <div class="row g-3 text-center" id="resumen">
                    <div class="col-6 col-md-3">
                        <div class="stat-number" id="totalVentas">0</div>
                        <div class="stat-label">Ventas</div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-number" id="totalMonto">$0</div>
                        <div class="stat-label">Total Vendido</div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-number" id="totalProductos">0</div>
                        <div class="stat-label">Productos Vendidos</div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-number" id="totalClientes">0</div>
                        <div class="stat-label">Clientes</div>
                    </div>
                </div>
            </div>

            <!-- Resultados -->
            <div class="query-card">
                <div class="d-flex justify-content-between align-items-center">
                    <h5><i class="fas fa-table"></i> Resultados</h5>
                    <span id="resultCount" class="badge bg-secondary">0 registros</span>
                </div>
                <div id="resultados" class="result-table">
                    <div class="text-center text-muted p-5">
                        <i class="fas fa-search fa-3x mb-2 d-block"></i>
                        Aplica filtros y presiona BUSCAR
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="notificacion" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/consultas.js"></script>
</body>
</html>
