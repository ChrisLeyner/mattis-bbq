<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matti's BBQ - Cocina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-card { border-left: 5px solid #ffc107; margin-bottom: 15px; transition: 0.3s; }
        .order-card.preparado { border-left-color: #17a2b8; background: #e3f2fd; }
        .order-card.pagado { border-left-color: #28a745; background: #e8f5e9; }
        .order-card.entregado { opacity: 0.6; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🔥 MATTI'S B-B-Q - COCINA</a>
            <button class="btn btn-outline-light btn-sm" onclick="location.href='/'">⬅ Volver a Caja</button>
        </div>
    </nav>
    <div class="container mt-3">
        <div class="row" id="ordersList">Cargando órdenes...</div>
    </div>
    <audio id="notificacion" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = io();

        async function cargarOrdenes() {
            try {
                const res = await fetch('/api/orders/kitchen');
                const orders = await res.json();
                renderizar(orders);
            } catch (error) {
                console.error(error);
            }
        }

        function renderizar(orders) {
            const container = document.getElementById('ordersList');
            if (!orders.length) {
                container.innerHTML = '<div class="text-center p-5"><h5>No hay órdenes pendientes</h5></div>';
                return;
            }
            container.innerHTML = orders.map(order => {
                let items = [];
                try { items = JSON.parse(order.items || '[]'); } catch(e) {}
                return `
                    <div class="col-md-6 col-lg-4">
                        <div class="card order-card ${order.estado}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <h5>${order.cliente}</h5>
                                    <span class="badge ${order.estado === 'preparado' ? 'bg-info' : 'bg-warning'}">${order.estado.toUpperCase()}</span>
                                </div>
                                <small>Orden: ${order.order_number}</small>
                                <hr>
                                ${items.map(i => `<div>${i.cantidad}x ${i.nombre} - $${i.subtotal?.toFixed(2)}</div>`).join('')}
                                <hr>
                                <h6 class="text-end">Total: $${order.total?.toFixed(2)}</h6>
                                <div class="d-grid gap-2">
                                    ${order.estado === 'pendiente' ? `<button class="btn btn-info btn-sm" onclick="cambiarEstado(${order.id}, 'preparado')">👨‍🍳 Preparado</button>` : ''}
                                    ${order.estado === 'preparado' ? `<button class="btn btn-success btn-sm" onclick="cambiarEstado(${order.id}, 'pagado')">💰 Cobrar</button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function cambiarEstado(id, nuevoEstado) {
            try {
                const res = await fetch(`/api/orders/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: nuevoEstado })
                });
                const data = await res.json();
                if (data.success) {
                    cargarOrdenes();
                    document.getElementById('notificacion').play().catch(()=>{});
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error de red');
            }
        }

        socket.on('nueva-orden', () => cargarOrdenes());
        socket.on('estado-actualizado', () => cargarOrdenes());
        cargarOrdenes();
        setInterval(cargarOrdenes, 5000);
    </script>
</body>
</html>
