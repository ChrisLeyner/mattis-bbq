<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Matti's BBQ - Cocina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #1a1a1a; font-family: Arial, sans-serif; padding-bottom: 30px; }
        .order-card { background: white; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-left: 6px solid #ffc107; transition: 0.2s; }
        .order-card.preparado { border-left-color: #17a2b8; opacity: 0.85; }
        .order-card.modificada { border-left-color: #dc3545; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        .order-item { border-bottom: 1px solid #eee; padding: 6px 0; font-size: 1.1rem; }
        .order-item-extra { background: #fff3cd; padding: 6px 10px; border-radius: 6px; margin: 5px 0; font-weight: bold; }
        .order-item-nuevo { background: #d1ecf1; padding: 6px 10px; border-radius: 6px; margin: 5px 0; font-weight: bold; border-left: 3px solid #0dcaf0; }
        .badge-pendiente { background: #ffc107; color: #000; font-size: 0.8rem; }
        .badge-preparado { background: #17a2b8; color: #fff; }
        .btn-preparar { background: #ffc107; color: #000; font-weight: bold; border: none; }
        .btn-preparar:hover { background: #e0a800; }
        .btn-editar { background: #0dcaf0; color: #000; font-weight: bold; border: none; }
        .btn-editar:hover { background: #0aa2c0; }
        .titulo-cocina { color: #ffc107; font-family: monospace; }
        .timestamp { font-family: monospace; font-size: 0.75rem; color: #666; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-black sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand titulo-cocina" href="#">🍳 COCINA - MATTI'S B-B-Q</a>
            <button class="btn btn-outline-warning btn-sm" onclick="cargarOrdenes()">🔄 ACTUALIZAR</button>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="row">
            <div class="col-12">
                <div id="ordenesCocina" class="row">
                    <div class="text-center p-5 text-white-50">Cargando órdenes...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para editar orden -->
    <div class="modal fade" id="editarOrdenModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-edit"></i> Editar Orden: <span id="editOrdenNumero"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editOrdenId">
                    
                    <!-- Productos actuales -->
                    <h6 class="border-bottom pb-2">📋 Productos actuales:</h6>
                    <div id="editListaActual" class="mb-3"></div>
                    
                    <!-- Agregar productos nuevos -->
                    <h6 class="border-bottom pb-2">➕ Agregar productos:</h6>
                    <div class="row g-2 mb-2">
                        <div class="col-md-6">
                            <select id="editProductoSelect" class="form-select form-select-sm">
                                <option value="">-- Seleccionar producto --</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="editCantidad" class="form-control form-control-sm" value="1" min="1" placeholder="Cant.">
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-sm btn-success w-100" onclick="agregarProductoAOrden()">
                                <i class="fas fa-plus"></i> Agregar a la orden
                            </button>
                        </div>
                    </div>
                    
                    <!-- Productos nuevos (aún no guardados) -->
                    <div id="editListaNuevos"></div>
                    
                    <div class="alert alert-info mt-3 mb-0">
                        <i class="fas fa-info-circle"></i>
                        Al guardar, la orden vuelve a estado <strong>PENDIENTE</strong> para que la cocina la prepare de nuevo.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarEdicion" onclick="guardarEdicionOrden()">
                        <i class="fas fa-save"></i> Guardar y Reactivar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <audio id="notificacion" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/cocina.js"></script>
</body>
</html>
