<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Matti's BBQ - Cocina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a1a; font-family: Arial, sans-serif; padding-bottom: 30px; }
        .order-card { background: white; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-left: 6px solid #ffc107; transition: 0.2s; }
        .order-card.preparado { border-left-color: #17a2b8; opacity: 0.8; }
        .order-item { border-bottom: 1px solid #eee; padding: 6px 0; font-size: 1.1rem; }
        .order-item-extra { background: #fff3cd; padding: 6px 10px; border-radius: 6px; margin: 5px 0; font-weight: bold; }
        .badge-pendiente { background: #ffc107; color: #000; font-size: 0.8rem; }
        .badge-preparado { background: #17a2b8; color: #fff; }
        .btn-preparar { background: #ffc107; color: #000; font-weight: bold; border: none; }
        .btn-preparar:hover { background: #e0a800; }
        .titulo-cocina { color: #ffc107; font-family: monospace; }
        .timestamp { font-family: monospace; font-size: 0.75rem; color: #666; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-black sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand titulo-cocina" href="#">🍳 COCINA - MATTI'S B-B-Q</a>
            <button class="btn btn-outline-warning btn-sm" onclick="cargarOrdenes()">🔄 ACTUALIZAR</button>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="row">
            <div class="col-12">
                <div id="ordenesCocina" class="row">
                    <div class="text-center p-5 text-white-50">Cargando órdenes...</div>
                </div>
            </div>
        </div>
    </div>
    
    <audio id="notificacion" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/cocina.js"></script>
</body>
</html>
